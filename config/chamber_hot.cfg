[mcu chamber_heater_mcu]
canbus_uuid: 58a72bb93aa4

[temperature_sensor chamber_heater_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: chamber_heater_mcu

[temperature_sensor chamber_heater_outlet_temp]
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 20000
sensor_pin: chamber_heater_mcu: PA4
min_temp: 0
max_temp: 150

[heater_generic chamber_heater]
gcode_id: C
heater_pin: chamber_heater_mcu: PA0
max_power: 1.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: chamber_heater_mcu: PA5
pullup_resistor: 20000
control: watermark
max_delta: 1.0
min_temp: 0
max_temp: 70 #set max temp 60

[heater_fan chamber_heater_fan]      
pin: chamber_heater_mcu: PA6   
max_power: 1.0      
cycle_time: 0.015         
kick_start_time: 0.5         
heater: chamber_heater             
heater_temp: 30           
tachometer_pin: chamber_heater_mcu: PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.004

[verify_heater chamber_heater]      
max_error: 70                
check_gain_time: 1200           
hysteresis: 1                
heating_gain: 1  