[temperature_fan exhaust_fan]  
pin: PB0                      
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
off_below: 0.13      # unter 13 % komplett aus, damit er nicht stottert
min_temp: 0
max_temp: 80
control: pid
target_temp: 30
pid_Kp: 25 
pid_Ki: 1
pid_Kd: 400
max_speed: 1.0
min_speed: 0.14              # dauerhafte Mindestleistung
gcode_id: D
tachometer_pin: PB1
tachometer_ppr: 1
tachometer_poll_interval: 0.0046