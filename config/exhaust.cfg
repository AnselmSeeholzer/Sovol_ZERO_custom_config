[temperature_fan exhaust_fan]  
pin: PB0                      
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.07                 # holds 10% at 70 ms, needs 12-13% at 15 ms
kick_start_time: 0.40            # 0.1 s default started 0/3 at 10%
off_below: 0.13      # unter 13 % komplett aus, damit er nicht stottert
min_temp: 0
max_temp: 80
control: pid
target_temp: 30
pid_Kp: 25 
pid_Ki: 1
pid_Kd: 400
max_speed: 1.0
min_speed: 0.14              # dauerhafte Mindestleistung
gcode_id: D
tachometer_pin: PB1
tachometer_ppr: 2                # two pulses per revolution
tachometer_poll_interval: 0.0019 # 0.0046 can't count full speed at 2 ppr