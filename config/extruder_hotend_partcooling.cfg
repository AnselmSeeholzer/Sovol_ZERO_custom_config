[mcu extruder_mcu]
canbus_uuid: 61755fe321ac

[temperature_sensor toolhead_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: extruder_mcu
min_temp: 0
max_temp: 80

[tmc2209 extruder]
uart_pin: extruder_mcu:PA12
interpolate: True             
run_current: 0.8                       
uart_address: 3
sense_resistor: 0.150          

[extruder]
step_pin: extruder_mcu:PA8
dir_pin: extruder_mcu:PA9
enable_pin: !extruder_mcu:PA11
rotation_distance: 6.5 
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.5
filament_diameter: 1.75
max_extrude_only_distance: 300
max_extrude_cross_section: 60
heater_pin: extruder_mcu:PB7
sensor_type: extruder_thermistor
pullup_resistor: 11500
sensor_pin: extruder_mcu:PA5
min_temp: 0
max_temp: 355
max_power: 1.0
min_extrude_temp: 150
pressure_advance: 0.02
pressure_advance_smooth_time: 0.025
max_extrude_only_velocity: 30
max_extrude_only_accel: 400

[adc_temperature extruder_thermistor]
temperature1:25
resistance1:1268.60
temperature2:180
resistance2:1920.98
temperature3:300
resistance3:2398.52

[verify_heater extruder]      
max_error: 120                
check_gain_time:20           
hysteresis: 5                
heating_gain: 2               

[heater_fan hotend_fan]      
pin: extruder_mcu:PA6   
max_power: 1.0      
cycle_time: 0.015         
kick_start_time: 0.5         
heater: extruder             
heater_temp: 45              
tachometer_pin: extruder_mcu:PA1
tachometer_ppr: 2
tachometer_poll_interval: 0.0013

[fan_generic partcooling_fan]
pin: extruder_mcu:PB0
max_power: 1.0
cycle_time: 0.015

[fan_generic auxiliary_fan]
pin: PE11
max_power: 1.0
cycle_time: 0.030                # holds 14% at 30 ms, needs 15% at 10-15 ms
kick_start_time: 0.100
off_below: 0.15                  # one point above the 14% running floor
tachometer_pin: ^PE13
tachometer_ppr: 2
tachometer_poll_interval: 0.0012