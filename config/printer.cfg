[include mainsail.cfg] #hier an erster Stelle, damit alle Standard PAUSE, RESUME, CANCEL_PRINT, END_PRINT Macros aus der mainsail.cfg (schreibgeschuetzt) von der macro.cfg überschrieben werden, weil sie später gelesen werden (das letzt Macro in der gesamten config (samt includes) zählt).
#[include timelapse.cfg]
#Testweise exkludiert: [include get_ip.cfg]
#[include moonraker_obico_macros.cfg]
#[include plr.cfg] #Brauche ich nichts bei dem kleinen Drucker. PowerLossResume.
[include motion.cfg]
[include heatbed_level.cfg]
[include extruder_hotend_partcooling.cfg]
[include chamber_hot.cfg] #Enabled after installing chamber module
[include recirculating_filter.cfg]
[include exhaust.cfg]
[include macro.cfg]

[mcu] 
canbus_uuid: 0d1445047cdd

[temperature_sensor mcu_temp]         
sensor_type: temperature_mcu
min_temp: 0
max_temp: 80

[temperature_sensor host_temp]     
sensor_type: temperature_host
min_temp: 0
max_temp: 80

[virtual_sdcard] 
path: /home/sovol/printer_data/gcodes/

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PA8,   EXP1_2=PC9,
    EXP1_3=PA10,  EXP1_4=PA9,
    EXP1_5=PC11,  EXP1_6=PC10,
    EXP1_7=PD8,   EXP1_8=PC12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14,  EXP2_2=PB13,
    EXP2_3=PC7,   EXP2_4=PB12,
    EXP2_5=PC6,   EXP2_6=PB15,
    EXP2_7=PC8,   EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>
	
[filament_switch_sensor filament_sensor]
pause_on_runout: False
switch_pin: PB2
runout_gcode: 
    {% if printer.print_stats.state == "printing" %}
       RESPOND TYPE=echo MSG="Filament runout detected while printing! Turned off partcooling & auxiliary fans. PAUSE."
       SET_FAN_SPEED FAN=partcooling_fan SPEED=0
       SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
       PAUSE
    {% endif %}
	
[display]                    
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel Screen_Colour]     
pin: EXP1_6
chain_count: 3
color_order: RGB             
initial_RED: 1.0             
initial_GREEN: 1.0         
initial_BLUE: 1.0                     

[output_pin main_led]
pin:PD13
value:1

[save_variables]
filename =/home/sovol/printer_data/config/saved_variables.cfg

