[gcode_macro _global_var]
variable_global_boundaries: {'x_min': -9.5, 'x_max': 154, 'y_min': -1.5, 'y_max': 152, 'z_min': -0.1, 'z_max': 150}
variable_global_retract: {'length': -0.5, 'feedrate': 2400}
variable_pause: {'x_park': -4, 'y_park': -1, 'z_lift': 10, 'x_y_park_feedrate': 9000, 'z_lift_feedrate': 1200, 'retract_length': -1, 'retract_feedrate': 2400}
variable_resume: {'x_park': -4, 'y_park': -1, 'z_lift': 10, 'x_y_park_feedrate': 9000, 'z_lift_feedrate': 1200, 'retract_length': -0.1, 'retract_feedrate': 2400}
variable_unload_filament: {'x_park': -4, 'y_park': -1, 'z_lift': 10, 'x_y_park_feedrate': 9000, 'z_lift_feedrate': 1200, 'extrude_length': 20, 'extrude_feedrate': 1000, 'retract_length': -80, 'retract_feedrate': 500, 'min_temp': 180}
variable_load_filament: {'x_park': -4, 'y_park': -1, 'z_lift': 10, 'x_y_park_feedrate': 9000, 'z_lift_feedrate': 1200, 'extrude_length': 100, 'extrude_feedrate': 1000, 'retract_length': -80, 'retract_feedrate': 500, 'min_temp': 180}
variable_dry_filament: {'temp_min': 25, 'temp_max': 55, 'duration_max': 180}
variable_rapid_extruder_cooldown: {'x_park': 75, 'y_park': 152, 'x_y_park_feedrate': 9000, 'z_lift': 10, 'z_lift_feedrate': 1200}
gcode:

[safe_z_home]
home_xy_position: 96,76.2
speed: 90.0
z_hop: 5
z_hop_speed: 10.0

[idle_timeout]
timeout: 1800
gcode: 
    {% if printer.print_stats.state == "paused" %}
     RESPOND TYPE=echo MSG="No operations in 30min! Printing is still paused."
    {% else %}
     RESPOND TYPE=echo MSG="No operations in idle_timeout! Turned off motors, heaters, partcooling & auxiliary fans. SET_IDLE_TIMEOUT TIMEOUT=1800 ."
     M84
     TURN_OFF_HEATERS
     SET_FAN_SPEED FAN=partcooling_fan SPEED=0
     SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
     SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=30
     SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endif %}
 
[gcode_macro START_PRINT]
variable_expected_printer: "SOVOL_ZERO"
gcode:
    {% set PRINTER_MODEL = (params.PRINTER_MODEL|default("UNDEFINED_PRINTER"))|string %}
    {% if PRINTER_MODEL != expected_printer %}
      { action_raise_error("GCODE is sliced for " ~ PRINTER_MODEL ~ ", expected " ~ expected_printer ~ ".") }
    {% elif  params.BED is not defined or params.NOZZLE is not defined %}
      { action_raise_error("START_PRINT aborted! BED and NOZZLE temperatures must be provided. CANCEL_PRINT.") }
    {% elif params.FILAMENT is not defined %}
      { action_raise_error("START_PRINT aborted! FILAMENT type must be provided. CANCEL_PRINT.") }
    {% else %}
      RESPOND TYPE=echo MSG="START_PRINT started..."
      CLEAR_PAUSE
      {% set bed = params.BED|int %}
      {% set nozzle = params.NOZZLE|int %}
      {% set filament = params.FILAMENT %}
      {% if filament == 'PLA' %}
          {% set WIPE_TEMP = 160 %}
          {% set EXHAUST_TEMP = 30 %}
      {% elif filament == 'PETG' %}
          {% set WIPE_TEMP = 170 %}
          {% set EXHAUST_TEMP = 35 %}
      {% elif filament == 'TPU' %}
          {% set WIPE_TEMP = 170 %}
          {% set EXHAUST_TEMP = 35 %}
      {% elif filament == 'ABS' %}
          {% set WIPE_TEMP = 230 %}
          {% set EXHAUST_TEMP = 60 %}
          SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={EXHAUST_TEMP}
      {% else %}
          { action_raise_error("START_PRINT aborted! Unknown filament: " ~ filament ~ ".") }
      {% endif %}
      RESPOND TYPE=echo MSG="Material: {filament}  WIPE_TEMP:{WIPE_TEMP}_°C EXHAUST_TEMP:{EXHAUST_TEMP}_°C"
      
      M83
      M140 S{bed}
      M104 S{140} #Little preheating before CLEAN_NOZZLE.
      SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target={EXHAUST_TEMP}
      SET_FAN_SPEED FAN=recirculating_filter SPEED={1}
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed-2} MAXIMUM={bed+2}
   
      G28
      
      CLEAN_NOZZLE WIPE_TEMP={WIPE_TEMP}
      PRESSURE_Z_OFFSET
      
      G90
      G1 Z0.3 F1000
      M400
      G1 X0 Y-1.5 F3000

      EDDY_CALIBRATION
      BED_MESH_CALIBRATE

      M104 S{nozzle}
      G91
      G1 Z0.3 F1000
      M400
      G90
      G1 X0 Y-1.5 F3000
      M400
      G1 Z0.2 F1000
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={nozzle-3} MAXIMUM={nozzle+3}

      G92 E0
      G90
      G1 X2 Y-1.5 Z0.3 F1000
      G1 X15 Y-1.5 E4 F1000
      G1 X15 Y-.6 F1000
      G1 X0 Y-1.5 E7 F1000
      G92 E0

      M400
      RESPOND TYPE=echo MSG="START_PRINT completed."
    {% endif %}
  
[gcode_macro LAYER_CHANGE_CUSTOM]
variable_enable_last_layer_cooldown: 1
variable_last_layer_cooldown_temp: 666
gcode:
    {% if printer.print_stats.state == "printing" %}
      RESPOND TYPE=echo MSG="LAYER_CHANGE_CUSTOM started..."
  
      {% if params.LAYER_NUM is not defined or params.TOTAL_LAYER_COUNT is not defined %}
        {% if params.LAYER_NUM is not defined %} 
          RESPOND TYPE=error MSG="LAYER_NUM is not defined."
        {% endif %}
        {% if params.TOTAL_LAYER_COUNT is not defined %}
          RESPOND TYPE=error MSG="TOTAL_LAYER_COUNT is not defined."
        {% endif %}
      {% else %}
        {% set LAYER_NUM = params.LAYER_NUM|int %}
        {% set TOTAL_LAYER_COUNT = params.TOTAL_LAYER_COUNT|int %}
        {% set EXTRUDER_TARGET = printer.extruder.target|int %}
        {% if LAYER_NUM == 0 %}
          RESPOND TYPE=echo MSG="All parameters for last layer temp decrease loadad successfully. enable_last_layer_cooldown={enable_last_layer_cooldown} last_layer_cooldown_temp={last_layer_cooldown_temp}"
        {% endif %}
  
        {% if enable_last_layer_cooldown == 1 and TOTAL_LAYER_COUNT > 1 and LAYER_NUM + 1 == TOTAL_LAYER_COUNT %}   #and OBJECT_NUM + 1 == TOTAL_OBJECT_COUNT
          RESPOND TYPE=echo MSG="LAST_LAYERCOOLDOWN: Regular extruder temp = {EXTRUDER_TARGET} °C."
          {% if last_layer_cooldown_temp != 666 %}
            {% set t = last_layer_cooldown_temp|int %}
            RESPOND TYPE=echo MSG="last_layer_cooldown_temp via filament custom gcode: last_layer_cooldown_temp = {t} °C."
          {% else %}
            {% set t = (EXTRUDER_TARGET - 5)|int %}
            RESPOND TYPE=echo MSG="Decrease extruder temp by 5°C, as last_layer_cooldown_temp is not defined in filament custom gcode. last_layer_cooldown_temp = {t} °C"  
          {% endif %}  
          SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t}   
        {% endif %}
      {% endif %}
      
      RESPOND TYPE=echo MSG="LAYER_CHANGE_CUSTOM completed."
    {% else %}
      RESPOND TYPE=error MSG="LAYER_CHANGE_CUSTOM only available while printing."
    {% endif %}

    ############# nescessary filament start gcode #############
    # SET_GCODE_VARIABLE MACRO=LAYER_CHANGE_CUSTOM VARIABLE=enable_last_layer_cooldown VALUE=1
    # SET_GCODE_VARIABLE MACRO=LAYER_CHANGE_CUSTOM VARIABLE=last_layer_cooldown_temp VALUE=205

[pause_resume] #nur wenn obico exkludiert ist

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_pause_state: 'normal' #?
variable_extruder_printjob_temp: 0
variable_extruder_pause_temp: 0
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="PAUSE started..."
      PAUSE_BASE
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=extruder_printjob_temp VALUE={printer.extruder.target}
      #SAVE_GCODE_STATE NAME=printjob_gcode_state
      {% set pause_retract_length = printer['gcode_macro _global_var'].pause.retract_length|float %}
      {% set pause_retract_feedrate = printer['gcode_macro _global_var'].pause.retract_feedrate|float %}
      {% set x_park = printer['gcode_macro _global_var'].pause.x_park|float %}
      {% set y_park = printer['gcode_macro _global_var'].pause.y_park|float %}
      {% set x_y_park_feedrate = printer["gcode_macro _global_var"].pause.x_y_park_feedrate|float %}
      {% set z_lift = printer['gcode_macro _global_var'].pause.z_lift|float %}
      {% set z_lift_feedrate = printer["gcode_macro _global_var"].pause.z_lift_feedrate|float %}
      {% set z_max = printer['gcode_macro _global_var'].global_boundaries.z_max|float %}
      {% set pause_state = params.PAUSE_STATE|default('normal') %}
          
      {% if pause_state == 'normal' %}
        RESPOND TYPE=echo MSG="normal PAUSE started..."
        M83
        G1 E{pause_retract_length} F{pause_retract_feedrate}
        
      {% elif pause_state == 'filament_change' %}
        RESPOND TYPE=echo MSG="filament_change PAUSE started..."
        UNLOAD_FILAMENT UNLOAD_FILAMENT_TEMP={printer.extruder.target-15|int}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_pause_temp}
      {% elif pause_state == 'filament_runout' %}
        RESPOND TYPE=echo MSG="filament_runout PAUSE started..."
        UNLOAD_FILAMENT UNLOAD_FILAMENT_TEMP={printer.extruder.target-15|int}
      {% endif %}
      G91
      {% if (printer.gcode_move.position.z + z_lift) < z_max %}
        G1 Z{z_lift} F{z_lift_feedrate}
      {% else %}
        G1 Z{(z_max - printer.gcode_move.position.z)} F{z_lift_feedrate}
      {% endif %}
              
      G90
      {% if printer.gcode_move.position.x != x_park or printer.gcode_move.position.y != y_park %}
         G1 X{x_park} Y{y_park} F{x_y_park_feedrate}
      {% endif %}
  
      RESPOND TYPE=echo MSG="PAUSE completed."
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for PAUSE!"
    {% endif %}
    
[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="RESUME started..."
      
      {% set resume_retract_length = printer['gcode_macro _global_var'].resume.retract_length|float %} #experimental underextrusion (-0.1mm) for testing.
      {% set resume_retract_feedrate = printer['gcode_macro _global_var'].resume.retract_feedrate|float %}
      {% set extruder_target = printer["gcode_macro PAUSE"].extruder_printjob_temp|int %}
  
      {% if printer["filament_switch_sensor filament_sensor"].enabled == True and printer["filament_switch_sensor filament_sensor"].filament_detected != True %}
         RESPOND TYPE=error MSG="Please Insert filament in Sensor!"
      {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_target}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_target-7}
        M83
        G1 E{resume_retract_length} F{resume_retract_feedrate}
        #RESTORE_GCODE_STATE NAME=printjob_gcode_state
        G90
        RESUME_BASE
        
        RESPOND TYPE=echo MSG="Print resumming!"
      {% endif %}
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for RESUME!"
    {% endif %}

[gcode_macro END_PRINT]
variable_state: 'normal'
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="END_PRINT started..."
  
      {% set end_print_retract_length = printer['gcode_macro _global_var'].global_retract.length|float %}
      {% set end_print_retract_feedrate = printer['gcode_macro _global_var'].global_retract.feedrate|float %}
      
      TURN_OFF_HEATERS
      M83
      G1 E{end_print_retract_length} F{end_print_retract_feedrate}
      RAPID_EXTRUDER_COOLDOWN
      M84 X Y Z E  
      M220 S100
      M221 S100
      
      RESPOND TYPE=echo MSG="END_PRINT completed."
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for END_PRINT!"
      TURN_OFF_HEATERS
    {% endif %}
    
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="CANCEL_PRINT started..."
  
      END_PRINT
      CANCEL_PRINT_BASE
      
      RESPOND TYPE=echo MSG="CANCEL_PRINT completed."
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for CANCEL_PRINT!"
      TURN_OFF_HEATERS
    {% endif %}

[gcode_macro CLEAN_NOZZLE] 
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="CLEAN_NOZZLE started..."
          
      {% if 'WIPE_TEMP' in params %}
        {% set wipe = params.WIPE_TEMP|float %}
      {% else %}
        {% set wipe = 160 %}
      {% endif %}
  
      {% if wipe < 150 %}
        RESPOND TYPE=error MSG="CLEAN_NOZZLE aborted! WIPE_TEMP too low ({wipe}°C)"
      {% endif %}
      
      G90
      G1 X0 Y0 F3000
      G1 Z0.3 F600
      M109 S{wipe}
      M104 S{125} #Prepare for PRESSURE_Z_OFFSET. (Less oozing for more accurate pressure probing) Risky?
      G91
      G1 Z3
      G90
      G1 X-9.2 Y0
      G91
      G1 Z-2.4
      G90
      G1 Y45 F2400
      G1 X-8.2 Y10
      G1 Y45 
      G1 X-8.2 Y10
      G1 Y38
      G1 X-9.2 Y12
      G1 Y38
      G1 X-9.2 Y12
      G1 Y33 
      G1 X-8.2 Y14
      G1 Y33 
      G1 X-8.2 Y14
      G1 Y28
      G1 X-9.2 Y16
      G1 Y28
      G1 X-9.2 Y16
      
      G1 Z2.4
      M400
      G1 X30 Y30 F9000
      M400
      G1 Z0.2 F1000
  
      M400
      RESPOND TYPE=echo MSG="CLEAN_NOZZLE completed."
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for CLEAN_NOZZLE!"
    {% endif %}
    
[gcode_macro PRESSURE_Z_OFFSET] 
gcode:
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    RESPOND TYPE=echo MSG="PRESSURE_Z_OFFSET started..."

    M104 S125
    G91
    G1 Z0.3 F1000    
    G90
    G1 X30 Y30 F3000
    G4 P300
    M400   
    RUN_PROBE_VIR_CONTACT
    M400
    G91
    G1 Z0.3 F1000
    G90
    M400
    RESPOND TYPE=echo MSG="PRESSURE_Z-OFFSET completed."
  {% else %}
    RESPOND TYPE=error MSG="Xyz must be homed for PRESSURE_Z_OFFSET!"
   {% endif %}

[gcode_macro EDDY_CALIBRATION] 
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="Eddy Calibration started..."
      
      RESPOND TYPE=echo MSG="Wait for Eddy Calibration temperature..."
      M104 S125
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={127} MAXIMUM={131}
      SET_GCODE_OFFSET Z=0
      Z_OFFSET_CALIBRATION METHOD=force_overlay BED_TEMP={printer.heater_bed.target}
      G28 Z
      M400
      RESPOND TYPE=echo MSG="Eddy Calibration completed."
   {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for EDDY_CALIBRATION!"
   {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      RESPOND TYPE=echo MSG="BED_MESH_CALIBRATE started..."
      
      {% set origin_square_corner_velocity_val = printer.toolhead.square_corner_velocity|float %}
      {% set temporarily_square_corner_velocity_val = 1.0 %}
  
      {% if printer.toolhead.homed_axes|lower != "xyz" %}
         G28
      {% endif %}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={temporarily_square_corner_velocity_val}
      BED_MESH_CALIBRATE_BASE ADAPTIVE=1 PGP=0 METHOD=rapid_scan
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={origin_square_corner_velocity_val}
  
      RESPOND TYPE=echo MSG="BED_MESH_CALIBRATE completed."
    {% else %}
      RESPOND TYPE=error MSG="Xyz must be homed for BED_MESH_CALIBRATE!"
    {% endif %}

[gcode_macro RAPID_EXTRUDER_COOLDOWN]
variable_cooldown_temp: 140
gcode:
    RESPOND TYPE=echo MSG="RAPID_EXTRUDER_COOLDOWN started..."
    
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_FAN_SPEED FAN=partcooling_fan SPEED=1
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=1
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      {% set x_park = printer['gcode_macro _global_var'].rapid_extruder_cooldown.x_park|float  %}
      {% set y_park = printer['gcode_macro _global_var'].rapid_extruder_cooldown.y_park|float  %}
      {% set x_y_park_feedrate = printer['gcode_macro _global_var'].rapid_extruder_cooldown.x_y_park_feedrate|float  %}
      {% set z_max = printer['gcode_macro _global_var'].global_boundaries.z_max|float  %}
      {% set z_lift = printer['gcode_macro _global_var'].rapid_extruder_cooldown.z_lift|float  %}
      {% set z_lift_feedrate = printer['gcode_macro _global_var'].rapid_extruder_cooldown.z_lift_feedrate|float  %}
      {% set cooldown_temp = cooldown_temp|float  %}
      
      G91
      {% if (printer.gcode_move.position.z + z_lift) < z_max %}
        G1 Z{z_lift} F{z_lift_feedrate}
      {% else %}
        G1 Z{z_max - printer.gcode_move.position.z} F{z_lift_feedrate}
      {% endif %}
      G90
      G1 X{x_park} Y{y_park} F{x_y_park_feedrate}
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={cooldown_temp}
    SET_FAN_SPEED FAN=partcooling_fan SPEED=0
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=0

    RESPOND TYPE=echo MSG="RAPID_EXTRUDER_COOLDOWN completed."

[gcode_macro UNLOAD_FILAMENT]
gcode:
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    {% set x_park = printer['gcode_macro _global_var'].unload_filament.x_park|float  %}
    {% set y_park = printer['gcode_macro _global_var'].unload_filament.y_park|float  %}
    {% set x_y_park_feedrate = printer['gcode_macro _global_var'].unload_filament.x_y_park_feedrate|float  %}
    {% set z_max = printer['gcode_macro _global_var'].global_boundaries.z_max|float  %}
    {% set z_lift = printer['gcode_macro _global_var'].unload_filament.z_lift|float  %}
    {% set z_lift_feedrate = printer['gcode_macro _global_var'].unload_filament.z_lift_feedrate|float  %}
    {% set extrude_length = printer['gcode_macro _global_var'].unload_filament.extrude_length|float  %}
    {% set extrude_feedrate = printer['gcode_macro _global_var'].unload_filament.extrude_feedrate|float  %}
    {% set retract_length = printer['gcode_macro _global_var'].unload_filament.retract_length|float  %}
    {% set retract_feedrate = printer['gcode_macro _global_var'].unload_filament.retract_feedrate|float  %}
    {% set unload_filament_min_temp = printer['gcode_macro _global_var'].unload_filament.min_temp|int %}

    {% if printer.print_stats.state != "printing" %}
      {% if params.UNLOAD_FILAMENT_TEMP is defined %}
        {% set unload_filament_temp = params.UNLOAD_FILAMENT_TEMP|int %}
        {% if unload_filament_temp >= unload_filament_min_temp %}
          RESPOND TYPE=echo MSG="UNLOAD_FILAMENT started..."
          SET_HEATER_TEMPERATURE HEATER=extruder TARGET={unload_filament_temp}
          {% if printer.gcode_move.position.z|float + z_lift <= z_max %}
            G91
            G1 Z{z_lift} F{z_lift_feedrate}
            G90
          {% endif %}  
          {% if printer.gcode_move.position.x|float != x_park or printer.gcode_move.position.y|float != y_park %}
            G90
            G1 X{x_park} Y{y_park} F{x_y_park_feedrate}
          {% endif %}
          TEMPERATURE_WAIT SENSOR=extruder MINIMUM={unload_filament_temp} MAXIMUM={unload_filament_temp+5}
          M83
          G1 E{extrude_length} F{extrude_feedrate}
          G1 E{retract_length} F{retract_feedrate}
          SET_HEATER_TEMPERATURE HEATER=extruder TARGET={0}
          M400
          RESPOND TYPE=echo MSG="UNLOAD_FILAMENT done."
        {% else %}
          RESPOND TYPE=error MSG="UNLOAD_FILAMENT aborted! unload_filament_temp = {unload_filament_temp} _°C is smaller than unload_filament_min_temp = {unload_filament_min_temp} _°C"
        {% endif %}
      {% else %}
         RESPOND TYPE=error MSG="UNLOAD_FILAMENT aborted! UNLOAD_FILAMENT_TEMP must be provided."
      {% endif %}
    {% else %}
       RESPOND TYPE=error MSG="UNLOAD_FILAMENT aborted! Not availabe during printing."
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG="UNLOAD_FILAMENT aborted! XYZ must be homed."
  {% endif %}

[gcode_macro LOAD_FILAMENT]
gcode:
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    {% set x_park = printer['gcode_macro _global_var'].load_filament.x_park|float  %}
    {% set y_park = printer['gcode_macro _global_var'].load_filament.y_park|float  %}
    {% set x_y_park_feedrate = printer['gcode_macro _global_var'].load_filament.x_y_park_feedrate|float  %}
    {% set z_max = printer['gcode_macro _global_var'].global_boundaries.z_max|float  %}
    {% set z_lift = printer['gcode_macro _global_var'].load_filament.z_lift|float  %}
    {% set z_lift_feedrate = printer['gcode_macro _global_var'].load_filament.z_lift_feedrate|float  %}
    {% set extrude_length = printer['gcode_macro _global_var'].load_filament.extrude_length|float  %}
    {% set extrude_feedrate = printer['gcode_macro _global_var'].load_filament.extrude_feedrate|float  %}
    {% set retract_length = printer['gcode_macro _global_var'].load_filament.retract_length|float  %}
    {% set retract_feedrate = printer['gcode_macro _global_var'].load_filament.retract_feedrate|float  %}
    {% set load_filament_min_temp = printer['gcode_macro _global_var'].load_filament.min_temp|int %}
    
    {% if printer.print_stats.state != "printing" %}
      {% if params.LOAD_FILAMENT_TEMP is defined %}
        {% set load_filament_temp = params.LOAD_FILAMENT_TEMP|int %}
        {% if load_filament_temp >= load_filament_min_temp %}
          {% if printer.gcode_move.position.x|float == x_park and printer.gcode_move.position.y|float == y_park %}
            RESPOND TYPE=echo MSG="LOAD_FILAMENT started..."
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={load_filament_temp}
            {% if printer.gcode_move.position.z|float + z_lift <= z_max %}
              G91
              G1 Z{z_lift} F{z_lift_feedrate}
              G90
            {% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={load_filament_temp} MAXIMUM={load_filament_temp+5}
            M83
            G1 E{extrude_length} F{extrude_feedrate}
            M400
            RAPID_EXTRUDER_COOLDOWN
            RESPOND TYPE=echo MSG="LOAD_FILAMENT completed."
          {% else %}
            RESPOND TYPE=error MSG="X must be {x_park}." 
            RESPOND TYPE=error MSG="Y must be {y_park}."
          {% endif %}
        {% else %}
          RESPOND TYPE=error MSG="LOAD_FILAMENT aborted! load_filament_temp = {load_filament_temp} _°C is smaller than load_filament_min_temp = {load_filament_min_temp} _°C"
        {% endif %}
      {% else %}
          RESPOND TYPE=error MSG="LOAD_FILAMENT aborted! LOAD_FILAMENT_TEMP must be provided."
      {% endif %}
    {% else %}
      RESPOND TYPE=error MSG="LOAD_FILAMENT aborted! Not availabe during printing."
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG="LOAD_FILAMENT aborted! XYZ must be homed."
  {% endif %}

[gcode_macro DRY_FILAMENT]
gcode:
    {% if params.DRY_TEMP is not defined or params.DRY_DURATION is not defined %}
      RESPOND TYPE=error MSG="DRY_FILAMENT aborted! DRY_TEMP and DRY_DURATION must be provided."
    {% else %}
      {% set dry_temp_min = printer['gcode_macro _global_var'].dry_filament.temp_min|float  %}
      {% set dry_temp_max = printer['gcode_macro _global_var'].dry_filament.temp_max|float  %}
      {% set dry_duration_max = printer['gcode_macro _global_var'].dry_filament.duration_max|float  %}
      {% set dry_temp = params.DRY_TEMP|int %}
      {% set dry_duration = params.DRY_DURATION|int %}
      {% if dry_temp < dry_temp_min %}
        RESPOND TYPE=error MSG="DRY_TEMP was smaller than dry_temp_min = {dry_temp_min} _°C!"
      {% elif dry_temp > dry_temp_max %}
        RESPOND TYPE=error MSG="DRY_TEMP was greater than dry_temp_max = {dry_temp_max} _°C!"
      {% elif dry_duration > dry_duration_max  %}
        RESPOND TYPE=error MSG="DRY_DURATION was greater than dry_duration_max = {dry_duration_max} _min!"  
      {% else %}
        SET_IDLE_TIMEOUT TIMEOUT={dry_duration*60}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target={dry_temp}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={dry_temp}    
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={dry_temp-5}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={0}
        SET_FAN_SPEED FAN=partcooling_fan SPEED=0.5
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0.5
        RESPOND TYPE=echo MSG="DRY_FILAMENT at dry_temp = {dry_temp} _°C for dry_duration {dry_duration} _min."
      {% endif %}
    {% endif %}

[gcode_macro M109]
rename_existing: M99109
gcode:    
    {% set s = params.S|float %}    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}   
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:    
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+2}  
    {% endif %}
    
[gcode_macro M106]
gcode:
    {% set fan_map = {
        0: "partcooling_fan",
        # 1: "unused",
        2: "auxiliary_fan",
        3: "recirculating_filter",
    } %}
    {% set p = params.P|int if 'P' in params else 0 %}
    {% set fan = fan_map[p] if p in fan_map else fan_map[0] %}
    {% set speed = (params.S|float / 255 if 'S' in params else 1.0) %}
    
    SET_FAN_SPEED FAN={fan} SPEED={speed}

[gcode_macro M107]
gcode:
        SET_FAN_SPEED FAN=partcooling_fan SPEED=0
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0

[gcode_macro M600]
gcode:
    RESPOND TYPE=echo MSG="Filament change started..."    
    PAUSE PAUSE_STATE=filament_change

[gcode_shell_command FACTORY_RESETS]
command: /home/sovol/factory_resets.sh
timeout: 2.

[force_move]
enable_force_move: False

